        .progress-bar-fill::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(45deg, rgba(255,255,255,0.25) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.25) 75%, transparent 75%, transparent); background-size: 30px 30px; animation: stripeMove 1s linear infinite; }

    <script>
        let labelsOpen = false;
        function toggleLabels() {
            
            if (typeof pop !== 'undefined') { pop.currentTime = 0; pop.play(); }
            labelsOpen = !labelsOpen;
            const root = document.getElementById('body-root') || document.body;
            const btn = document.getElementById('label-toggle-btn');
            root.classList.toggle('hide-labels', !labelsOpen);
            if (btn) btn.innerHTML = labelsOpen ? '&#128683;' : '&#127991;&#65039;';
            updateCircuitLabels();
            updateFeatureToggleLabels();
        }
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsOdnjfzdpZPaLEojtMJFNjs8t2EJaoPYib4kVj6GrCXKMwt9Fj6iV6swJbicaM28QOw/exec';
        let steps = 0, time = 0, isPro = false, isQuantumMode = false, timerInterval, gateHistory = [], isSolved = false;
        let selectedIndices = [];
        let actionStack = [];
        let fishAtNode = [7, 1, 4, 3, 0, 2, 6, 5];
        const PROGRESS_TOTAL = 8;
        const PROGRESS_DEFAULT_CODE = '111';

        const PROGRESS_BITS = Math.round(Math.log2(PROGRESS_TOTAL));
        const PROGRESS_MAX_DISTANCE = PROGRESS_TOTAL * PROGRESS_BITS;
        let featureStates = Array(PROGRESS_BITS).fill(null);
        function getHammingDistance(a, b) {
            const s1 = a.toString(2).padStart(PROGRESS_BITS, '0');
            const s2 = b.toString(2).padStart(PROGRESS_BITS, '0');
            let dist = 0;
            for (let i = 0; i < PROGRESS_BITS; i++) {
                if (s1[i] !== s2[i]) dist++;
            }
            return dist;
        }
        function getTotalHammingDistance() {
            return fishAtNode.reduce((sum, fishId, nodeIndex) => sum + getHammingDistance(nodeIndex, fishId), 0);
        }
        function ensureDistanceBadges() {
            for (let i = 0; i < PROGRESS_TOTAL; i++) {
                const node = document.getElementById(`node-${i}`);
                if (!node || document.getElementById(`dist-badge-${i}`)) continue;
                node.insertAdjacentHTML('beforeend', `<div class="node-dist-badge hidden" id="dist-badge-${i}"></div>`);
            }
        }
        function getFeatureImageIndex(index) {
            return PROGRESS_BITS === 2 ? index + 2 : index + 1;
        }
        function getFeatureSkinFolder() {
            if (typeof currentSkin === 'undefined') return './RIP/';
            if (currentSkin === 'rip') return './RIP/';
            if (currentSkin === 'poto') return './poto/';
            if (currentSkin === 'mj') return './mj/';
            return './svg/';
        }
        function updateCircuitLabels() {
            const folder = getFeatureSkinFolder();
            for (let i = 0; i < PROGRESS_BITS; i++) {
                const label = document.getElementById(`q${i}-label`) || document.getElementById(`q-label-${i}`);
                if (!label) continue;
                if (labelsOpen) {
                    label.innerHTML = (typeof isQuantumMode !== 'undefined' && isQuantumMode) ? `q${i}` : `d${i + 1}`;
                } else {
                    const imgIndex = getFeatureImageIndex(i);
                    label.innerHTML = `<img src="${folder}dif${imgIndex}.png" style="width: 36px; height: 36px; object-fit: contain; padding: 2px;" alt="dif${imgIndex}">`;
                }
            }
        }
        function updateFeatureToggleLabels() {
            for (let i = 0; i < PROGRESS_BITS; i++) {
                const label = document.getElementById(`feat-toggle-${i}`);
                if (!label) continue;
                let badge = '';
                let styleClass = '';
                if (featureStates[i] === 1) {
                    styleClass = 'feature-state-1';
                    badge = `<div style="position:absolute; top:-6px; right:-6px; background:#FFB800; color:#fff; font-size:12px; font-weight:900; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; border:2px solid #fff; z-index:10; box-shadow: 1px 1px 0 rgba(70,52,56,0.3);">1</div>`;
                } else if (featureStates[i] === 0) {
                    styleClass = 'feature-state-0';
                    badge = `<div style="position:absolute; top:-6px; right:-6px; background:#463438; color:#fff; font-size:12px; font-weight:900; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; border:2px solid #fff; z-index:10; box-shadow: 1px 1px 0 rgba(70,52,56,0.3);">0</div>`;
                }
                if (labelsOpen) {
                    label.innerHTML = `<div style="position:relative;"><span class="${styleClass}" style="padding: 2px 6px; display: inline-block; border-radius: 6px; border:2px solid transparent;">d${i + 1}</span>${badge}</div>`;
                } else {
                    const folder = getFeatureSkinFolder();
                    label.innerHTML = `<div style="position:relative;"><img src="${folder}dif${getFeatureImageIndex(i)}.png" class="${styleClass}" style="width: 36px; height: 36px; object-fit: contain; border-radius: 8px; padding: 2px; border:3px solid transparent;" alt="dif${getFeatureImageIndex(i)}">${badge}</div>`;
                }
            }
        }
        function toggleFeature(qIndex) {
            if (typeof pop !== 'undefined') { pop.currentTime = 0; pop.play(); }
            if (featureStates[qIndex] === null) featureStates[qIndex] = 1;
            else if (featureStates[qIndex] === 1) featureStates[qIndex] = 0;
            else featureStates[qIndex] = null;
            updateCircuitLabels();
            updateFeatureToggleLabels();
            updateFeatureHighlights();
        }
        function updateFeatureHighlights() {
            ensureDistanceBadges();
            const anyActive = featureStates.some(f => f !== null);
            const root = document.getElementById('body-root') || document.body;
            root.classList.toggle('feature-filter-active', anyActive);
            for (let i = 0; i < PROGRESS_TOTAL; i++) {
                const node = document.getElementById(`node-${i}`);
                const fish = document.getElementById(`fish-${i}`);
                const badge = document.getElementById(`dist-badge-${i}`);
                if (!node) continue;
                if (!anyActive) {
                    node.classList.remove('feature-highlight', 'feature-dimmed');
                    if (fish) fish.classList.remove('feature-highlight', 'feature-dimmed');
                    if (badge) badge.classList.add('hidden');
                    continue;
                }
                const bits = i.toString(2).padStart(PROGRESS_BITS, '0');
                let match = true;
                for (let q = 0; q < PROGRESS_BITS; q++) {
                    if (featureStates[q] === 1 && bits[q] !== '1') match = false;
                    if (featureStates[q] === 0 && bits[q] !== '0') match = false;
                }

                isCanvasSwiping = false;
            });
            canvas.addEventListener('mousemove', (e) => { if (indicator.classList.contains('active') && !isTouchDevice) { const rect = canvas.getBoundingClientRect(); indicator.style.left = (e.clientX - rect.left) + 'px'; indicator.style.top = (e.clientY - rect.top - 25) + 'px'; } });
            canvas.addEventListener('mousedown', (e) => { if (lockedLineId && !isTouchDevice && e.button === 0 && !e.target.classList.contains('connection-line')) cancelLock(); });
            canvas.addEventListener('contextmenu', (e) => { if (lockedLineId && !isTouchDevice) { e.preventDefault(); if (lineMode === 4 && hoverLine) applyGate(`X${2 - hoverLine.dim}`); else if (lineMode === 1 && hoverLine) applyGate(`SWAP_${hoverLine.i}_${hoverLine.j}`); else if (currentOptions[currentOptionIndex]) applyGate(currentOptions[currentOptionIndex].gateType); } });
            document.addEventListener('wheel', (e) => { if (!lockedLineId || lineMode === 1 || lineMode === 4 || isTouchDevice) return; if (!e.target.closest('#gate-scroll-area') && !e.target.closest('#circuit-content-wrapper')) { e.preventDefault(); if (e.deltaY > 0) currentOptionIndex = (currentOptionIndex + 1) % currentOptions.length; else currentOptionIndex = (currentOptionIndex - 1 + currentOptions.length) % currentOptions.length; hasScrolled = true; showIndicatorScrolled(); } }, { passive: false });
        };
            var activeRankType = 'steps';
        var rankChampionTimers = [];
        function rankDisplayName(item) { return item.username || item.name || 'Anonymous'; }
        function rankAvatarHtml(item) {
            return item && item.photo ? `<img src="${item.photo}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:${item.photoX||50}% ${item.photoY||50}%;transform-origin:${item.photoX||50}% ${item.photoY||50}%;transform:scale(${item.photoScale||1});">` : '🐱';
        }
        function sortedRankData(type) {
            if (!leaderboardData || leaderboardData.length === 0) return [];
            const secondary = type === 'steps' ? 'time' : 'steps';
            return [...leaderboardData].sort((a, b) => {
                const primaryDiff = Number(a[type] ?? Infinity) - Number(b[type] ?? Infinity);
                if (primaryDiff !== 0) return primaryDiff;
                return Number(a[secondary] ?? Infinity) - Number(b[secondary] ?? Infinity);
            });
        }
        function toggleLeaderboard() { const wrapper = document.getElementById('leaderboard-wrapper'); if (!wrapper) return; wrapper.classList.toggle('expanded'); if (wrapper.classList.contains('expanded')) setTimeout(() => showRankChampion(activeRankType), 380); }
        async function fetchLeaderboard() {
            const listArea = document.getElementById('rankList');
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getLeaderboard&level=12`);
                const data = await response.json();
                leaderboardData = Array.isArray(data) ? data : [];
                if (leaderboardData.length > 0) renderRank(activeRankType, !(document.getElementById('leaderboard-wrapper')?.classList.contains('expanded')));
                else if (listArea) listArea.innerHTML = '<p class="text-center italic text-gray-400 mt-10 text-sm">No records yet</p>';
            } catch (e) {
                if (listArea) listArea.innerHTML = '<p class="text-center italic text-red-400 mt-10 text-sm">Load Error</p>';
            }
        }
        function renderRank(type, silent) {
            activeRankType = type === 'time' ? 'time' : 'steps';
            const tabSteps = document.getElementById('tab-steps'), tabTime = document.getElementById('tab-time'), listArea = document.getElementById('rankList');
            if (tabSteps && tabTime) {
                tabSteps.className = activeRankType === 'steps' ? 'rank-tab active' : 'rank-tab bg-gray-100';
                tabTime.className = activeRankType === 'time' ? 'rank-tab active' : 'rank-tab bg-gray-100';
            }
            const sorted = sortedRankData(activeRankType);
            if (!listArea) return;
            if (sorted.length === 0) { listArea.innerHTML = '<p class="text-center italic text-gray-400 mt-10 text-sm">No records yet</p>'; return; }
            let html = '';
            sorted.slice(0, 10).forEach((item, index) => {
                const displayValue = activeRankType === 'steps' ? item.steps + '🐾' : item.time + 's';
                const crown = index === 0 ? '<span class="rank-crown">👑</span>' : '';
                html += `<div class="rank-item ${index === 0 ? 'rank-champion' : ''}"><div class="rank-player-main"><span class="rank-number">${index + 1}.</span><div class="rank-avatar-wrap">${crown}<div class="rank-avatar-sm">${rankAvatarHtml(item)}</div></div><span class="rank-name">${rankDisplayName(item)}</span></div><span class="rank-value">${displayValue}</span></div>`;
            });
            listArea.innerHTML = html;
            if (!silent) showRankChampion(activeRankType);
        }
        function showRankChampion(type) {
            if (currentSidePanel !== 'rank') return;
            const wrapper = document.getElementById('leaderboard-wrapper');
            if (wrapper && !wrapper.classList.contains('expanded')) return;
            const champion = sortedRankData(type)[0];
            if (!champion) return;
            rankChampionTimers.forEach(id => clearTimeout(id));
            rankChampionTimers = [];
            let backdrop = document.getElementById('rankChampionBackdrop');
            if (!backdrop) {
                backdrop = document.createElement('div');
                backdrop.id = 'rankChampionBackdrop';
                backdrop.className = 'rank-champion-backdrop';
                document.body.appendChild(backdrop);
            }
            let toast = document.getElementById('rankChampionToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'rankChampionToast';
                toast.className = 'rank-champion-toast';
                document.body.appendChild(toast);
            }
	    toast.style.zIndex = '4000';
            const label = type === 'time' ? 'TIME CHAMPION' : 'STEPS CHAMPION';
            const anchor = document.querySelector('#rankList .rank-item.rank-champion') || document.querySelector('#rankList .rank-item');
            const rect = anchor ? anchor.getBoundingClientRect() : { left: 12, top: 110, width: 210, height: 42 };
            toast.style.left = Math.round(rect.left + 8) + 'px';
            toast.style.top = Math.round(rect.top + rect.height / 2) + 'px';
            toast.style.maxWidth = Math.max(220, Math.round(rect.width + 28)) + 'px';
            backdrop.classList.remove('show');
            toast.className = 'rank-champion-toast';
            toast.innerHTML = `<div class="rank-avatar-wrap"><span class="rank-crown">👑</span><div class="rank-avatar-sm">${rankAvatarHtml(champion)}</div></div><div class="rank-champion-text"><span class="rank-champion-label">${label}</span><span class="rank-champion-name">${rankDisplayName(champion)}</span></div>`;
            void toast.offsetWidth;
            backdrop.classList.add('show');
            toast.classList.add('show');
            rankChampionTimers.push(setTimeout(() => { toast.classList.remove('show'); backdrop.classList.remove('show'); }, 1450));
        }
            function replayCurrentLevel() {
            window.location.reload();
        }    
        const SKIN_STORAGE_KEY = 'meowtopiaSkin';
        const AVAILABLE_SKINS = ['default', 'rip', 'poto', 'mj'];
        let currentSkin = AVAILABLE_SKINS.includes(sessionStorage.getItem(SKIN_STORAGE_KEY)) ? sessionStorage.getItem(SKIN_STORAGE_KEY) : 'default';
        let currentSidePanel = 'rank';
        function getSkinSpriteCount() {
            return Math.max(
                document.querySelectorAll('.node[id^="node-"]').length,
                document.querySelectorAll('.fish-wrapper[id^="fish-"]').length
            );
        }
        function getSkinBits(index, count) {
            return index.toString(2).padStart(count > 8 ? 4 : count > 4 ? 3 : 2, '0');
        }
        function defaultSkinCode(index, count) {
            const bits = getSkinBits(index, count);
            if (count > 8) return '0' + bits.slice(2);
            if (count > 4) return bits;
            return '0' + bits;
        }
        function defaultSkinHat(kind, index, count) {
            if (count <= 8) return '';
            const bits = getSkinBits(index, count);
            if (bits[1] !== '1') return '';
            const asset = kind === 'cat' ? 'hat-c' : 'hat-f';
            const cls = kind === 'cat' ? 'cat-hat' : 'fish-hat';
            return '<img src="./svg/' + asset + '.svg" class="hat-img ' + cls + ' hat-bg-shape" alt=""><img src="./svg/' + asset + '.svg" class="hat-img ' + cls + '" alt="">';
        }
        function defaultSkinFaded(index, count) {
            return count > 8 && getSkinBits(index, count)[0] === '1' ? ' bit-faded' : '';
        }
        function catLayerHtml(src, className, alt) {
            return '<img src="' + src + '" class="' + className + ' cat-bg-shape" alt=""><img src="' + src + '" class="' + className + '" alt="' + alt + '">';
        }
        function fishLayerHtml(src, faded, alt) {
            return '<img src="' + src + '" class="fish-bg-shape encoded-img' + faded + '" alt=""><img src="' + src + '" class="fish-img encoded-img' + faded + '" alt="' + alt + '">';
        }
        function skinAssetHtml(kind, index, count, label) {
            const text = label || getSkinBits(index, count);
            if (currentSkin === 'rip') {
                const src = './RIP/' + (kind === 'cat' ? 'Cat' : 'Fish') + (index + 1) + '.png';
                return kind === 'cat' ? catLayerHtml(src, 'skin-cat encoded-img', text + ' cat') : fishLayerHtml(src, '', text + ' fish');
            }
            if (currentSkin === 'poto') {
                const src = './poto/' + (kind === 'cat' ? 'cat' : 'fish') + index + '.png';
                return kind === 'cat' ? catLayerHtml(src, 'skin-cat encoded-img', text + ' cat') : fishLayerHtml(src, '', text + ' fish');
            }
            if (currentSkin === 'mj') {
                const src = './mj/' + (kind === 'cat' ? 'Cat' : 'Fish') + index + '.png';
                return kind === 'cat' ? catLayerHtml(src, 'skin-cat encoded-img', text + ' cat') : fishLayerHtml(src, '', text + ' fish');
            }
            const code = defaultSkinCode(index, count);
            const faded = defaultSkinFaded(index, count);
            if (kind === 'cat') {
                return defaultSkinHat('cat', index, count) + catLayerHtml('./svg/' + code + '-c.svg', 'skin-cat encoded-img' + faded, text + ' cat');
            }
            return defaultSkinHat('fish', index, count) + fishLayerHtml('./svg/' + code + '-f.svg', faded, text + ' fish');
        }
        function applySkinClass() {
            const root = document.getElementById('body-root') || document.body;
            root.classList.toggle('skin-rip', currentSkin === 'rip');
            root.classList.toggle('skin-poto', currentSkin === 'poto');
            root.classList.toggle('skin-mj', currentSkin === 'mj');
            ['default', 'rip', 'poto', 'mj'].forEach(skin => {
                const option = document.getElementById('skin-option-' + skin);
                if (option) option.classList.toggle('active', currentSkin === skin);
            });
        }
        function refreshSkinAssets() {
            applySkinClass();
            const count = getSkinSpriteCount();
            for (let i = 0; i < count; i++) {
                const node = document.getElementById('node-' + i);
                const fish = document.getElementById('fish-' + i);
                const isMjLarge = currentSkin === 'mj' && i % 2 === 1;
                if (node) node.classList.toggle('large-node', isMjLarge);
                if (fish) fish.classList.toggle('large-node', isMjLarge);
                const nodeLabel = (node && node.querySelector('.fixed-number') && node.querySelector('.fixed-number').textContent) || getSkinBits(i, count);
                const fishLabel = (fish && fish.querySelector('.fish-label') && fish.querySelector('.fish-label').textContent) || getSkinBits(i, count);
                if (node) {
                    node.innerHTML = '<div class="fixed-number">' + nodeLabel + '</div>' + skinAssetHtml('cat', i, count, nodeLabel);
                }
                if (fish) {
                    fish.innerHTML = '<div class="fish-label">' + fishLabel + '</div>' + skinAssetHtml('fish', i, count, fishLabel);
                }
            }
        }
        function setSidePanel(panel) {
            if (!['rank', 'skin'].includes(panel)) panel = 'rank';
            currentSidePanel = panel;
            const rankPanel = document.getElementById('rank-panel');
            const skinPanel = document.getElementById('skin-panel');
            const rankBookmark = document.getElementById('rank-bookmark');
            const skinBookmark = document.getElementById('skin-bookmark');
            if (rankPanel) rankPanel.classList.toggle('hidden', panel !== 'rank');
            if (skinPanel) skinPanel.classList.toggle('hidden', panel !== 'skin');
            if (rankBookmark) rankBookmark.classList.toggle('active', panel === 'rank');
            if (skinBookmark) skinBookmark.classList.toggle('active', panel === 'skin');
        }
        function toggleSidePanel(panel) {
            playPopSound();
            const wrapper = document.getElementById('leaderboard-wrapper');
            if (!wrapper) return;
            const isExpanded = wrapper.classList.contains('expanded');
            if (currentSidePanel === panel && isExpanded) {
                wrapper.classList.remove('expanded');
                return;
            }
            setSidePanel(panel);
            wrapper.classList.add('expanded');
            if (panel === 'rank' && typeof showRankChampion === 'function') {
                window.setTimeout(() => showRankChampion(typeof activeRankType === 'undefined' ? 'steps' : activeRankType), 380);
            }
        }
        function toggleLeaderboard() {
            toggleSidePanel('rank');
        }
        function selectSkin(skin) {
            playPopSound();
            if (!AVAILABLE_SKINS.includes(skin)) skin = 'default';
            currentSkin = skin;
            sessionStorage.setItem(SKIN_STORAGE_KEY, skin);
            if (typeof updateProgressImages === 'function') updateProgressImages();
            refreshSkinAssets(); updateCircuitLabels();
            if (typeof updateFeatureToggleLabels === 'function') updateFeatureToggleLabels();
            if (typeof updateFishUI === 'function') updateFishUI();
        }
        (function wrapSkinOnload() {
            const originalOnload = window.onload;
            window.onload = function (event) {
                if (typeof originalOnload === 'function') originalOnload.call(window, event);
                refreshSkinAssets(); updateCircuitLabels();
                if (typeof updateFeatureToggleLabels === 'function') updateFeatureToggleLabels();
            if (typeof updateFishUI === 'function') updateFishUI();
            };
        })();
</script>
