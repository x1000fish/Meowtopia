        #pro-panel {width: 280px !important; height: 628px !important;padding: 20px !important;border: 8px solid #463438;border-radius: 40px; box-shadow: 10px 10px 0px #99C44D;}

    <script>
        let initialFishAtNode = Array.from({ length: 8 }, (_, i) => i);
        let isQuantumMode = false;
        let isTraceMode = false;
        let isRainbowMode = false;
        let activeTraceInput = null;
        let currentTraceStep = 0;
        let gateCount = 0, gateHistory = [];
        let selectedIndices = [], actionStack = [];
        let fishAtNode = [];
        let lineMode = 1, hoverLine = null;
        let lockedLineId = null;
        let currentOptionIndex = 0, currentOptions = [], draggedIndex = null;
        let mobileDragging = false;
        let mDragIndex = null;
        let dragGhost = null;
        let originalDragEl = null;
        let isTouchDevice = false;
        let activeMobileLine = null;
        let touchStartY = 0;
        let lastSwipeTime = 0;
        let lastTiltDirection = 0;
        let canvasTouchStartX = 0, canvasTouchStartY = 0;
        let lastCanvasX = 0, lastCanvasY = 0;
        let isCanvasSwiping = false;
        const TILT_THRESHOLD = 15;
        const RETURN_THRESHOLD = 10;
        let gyroPermissionGranted = false;
        const pop = new Audio('pop.m4a');
        let labelsOpen = false;
        const LAB_TOTAL = 8;
        const LAB_BITS = 3;
        const SKIN_STORAGE_KEY = 'meowtopiaSkin';
        const AVAILABLE_SKINS = ['default', 'rip', 'poto', 'mj'];
        let currentSkin = 'default';
        let featureStates = Array(LAB_BITS).fill(null);

        function playPopSound() {
            if (typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(e => {}); }
        }

        function editInitialInput() {
            playPopSound();
            const current = initialFishAtNode.join(', ');
            const modal = document.getElementById('input-modal');
            const inputField = document.getElementById('initial-input-field');
            inputField.value = current;
            modal.classList.remove('hidden-el');
        }

        function closeInputModal() {
            playPopSound();
            document.getElementById('input-modal').classList.add('hidden-el');
        }

        function saveInitialInput() {
            playPopSound();
            const inputField = document.getElementById('initial-input-field');
            const res = inputField.value;
            if (!res) return;
            const parsed = res.replace(/\s/g, '').split(',').map(Number);
            const isValid = parsed.length === LAB_TOTAL &&
                new Set(parsed).size === LAB_TOTAL &&
                parsed.every(n => Number.isInteger(n) && n >= 0 && n < LAB_TOTAL);
            if (!isValid) {
                alert(`Invalid format. Enter ${LAB_TOTAL} unique numbers from 0 to ${LAB_TOTAL - 1}, for example: ${Array.from({ length: LAB_TOTAL }, (_, i) => i).join(',')}`);
                return;
            }
            initialFishAtNode = parsed;
            activeTraceInput = null;
            currentTraceStep = 0;
            refreshSkinAssets();
            recalculate();
            closeInputModal();
        }

        function toggleRainbowMode() {
            playPopSound();
            isRainbowMode = !isRainbowMode;
            if (isRainbowMode) featureStates.fill(null);
            updateFeatureToggleLabels();
            updateFeatureHighlights();
            refreshSkinAssets();
            updateTruthTable();
            updateFishUI();
        }

        function getSkinBits(index, count = LAB_TOTAL) {
            return index.toString(2).padStart(count > 8 ? 4 : count > 4 ? 3 : 2, '0');
        }

        function defaultSkinCode(index, count = LAB_TOTAL) {
            const bits = getSkinBits(index, count);
            if (count > 8) return '0' + bits.slice(2);
            if (count > 4) return bits;
            return '0' + bits;
        }

        function defaultSkinHat(kind, index, count = LAB_TOTAL) {
            if (count <= 8) return '';
            const bits = getSkinBits(index, count);
            if (bits[1] !== '1') return '';
            const asset = kind === 'cat' ? 'hat-c' : 'hat-f';
            const cls = kind === 'cat' ? 'cat-hat' : 'fish-hat';
            return '<img src="./svg/' + asset + '.svg" class="hat-img ' + cls + ' hat-bg-shape" alt=""><img src="./svg/' + asset + '.svg" class="hat-img ' + cls + '" alt="">';
        }

        function defaultSkinFaded(index, count = LAB_TOTAL) {
            return count > 8 && getSkinBits(index, count)[0] === '1' ? ' bit-faded' : '';
        }

        function catLayerHtml(src, className, alt) {
            return '<img src="' + src + '" class="' + className + ' cat-bg-shape" alt=""><img src="' + src + '" class="' + className + '" alt="' + alt + '">';
        }

        function fishLayerHtml(src, faded, alt) {
            return '<img src="' + src + '" class="fish-bg-shape encoded-img' + faded + '" alt=""><img src="' + src + '" class="fish-img encoded-img' + faded + '" alt="' + alt + '">';
        }

        function skinAssetHtml(kind, index, count = LAB_TOTAL, label) {
            const text = label || getSkinBits(index, count);
            if (isRainbowMode) {
                const src = './image/' + (kind === 'cat' ? 'Cat' : 'Fish') + ((index % 8) + 1) + '.svg';
                const hat = count > 8 ? defaultSkinHat(kind, index, count) : '';
                return kind === 'cat'
                    ? hat + '<img src="' + src + '" class="skin-cat" alt="' + text + ' cat">'
                    : hat + '<img src="' + src + '" class="fish-img" alt="' + text + ' fish">';
            }
            if (currentSkin === 'rip') {
                const src = './RIP/' + (kind === 'cat' ? 'Cat' : 'Fish') + (index + 1) + '.png';
                return kind === 'cat' ? catLayerHtml(src, 'skin-cat encoded-img', text + ' cat') : fishLayerHtml(src, '', text + ' fish');
            }
            if (currentSkin === 'poto') {
                const src = './poto/' + (kind === 'cat' ? 'cat' : 'fish') + index + '.png';
                return kind === 'cat' ? catLayerHtml(src, 'skin-cat encoded-img', text + ' cat') : fishLayerHtml(src, '', text + ' fish');
            }
            if (currentSkin === 'mj') {
                const src = './mj/' + (kind === 'cat' ? 'Cat' : 'Fish') + index + '.png';
                return kind === 'cat' ? catLayerHtml(src, 'skin-cat encoded-img', text + ' cat') : fishLayerHtml(src, '', text + ' fish');
            }
            const code = defaultSkinCode(index, count);
            const faded = defaultSkinFaded(index, count);
            if (kind === 'cat') {
                return defaultSkinHat('cat', index, count) + catLayerHtml('./svg/' + code + '-c.svg', 'skin-cat encoded-img' + faded, text + ' cat');
            }
            return defaultSkinHat('fish', index, count) + fishLayerHtml('./svg/' + code + '-f.svg', faded, text + ' fish');
        }

        function truthSpriteHtml(kind, index) {
            const isMjLarge = currentSkin === 'mj' && index % 2 === 1 && !isRainbowMode;
            const extraClass = isMjLarge ? ' large-node' : '';
            return '<span class="truth-sprite' + extraClass + '">' + skinAssetHtml(kind, index, LAB_TOTAL, getSkinBits(index)) + '</span>';
        }

        function initSkinFromUser(urlParams) {
            const passedSkin = urlParams.get('skin') || sessionStorage.getItem(SKIN_STORAGE_KEY);
            currentSkin = AVAILABLE_SKINS.includes(passedSkin) ? passedSkin : 'default';
            sessionStorage.setItem(SKIN_STORAGE_KEY, currentSkin);
        }

        function applySkinClass() {
            const root = document.getElementById('body-root') || document.body;
            root.classList.toggle('skin-rip', !isRainbowMode && currentSkin === 'rip');
            root.classList.toggle('skin-poto', !isRainbowMode && currentSkin === 'poto');
            root.classList.toggle('skin-mj', !isRainbowMode && currentSkin === 'mj');
            root.classList.toggle('skin-rainbow', isRainbowMode);
            AVAILABLE_SKINS.forEach(skin => {
                const option = document.getElementById('skin-option-' + skin);
                if (option) option.classList.toggle('active', currentSkin === skin);
            });
        }

        function refreshSkinAssets() {
            applySkinClass();
            for (let i = 0; i < LAB_TOTAL; i++) {
                const node = document.getElementById('node-' + i);
                const fish = document.getElementById('fish-' + i);
                const catId = i; 
                
                const isMjLarge = currentSkin === 'mj' && catId % 2 === 1 && !isRainbowMode;
                if (node) {
                    node.classList.toggle('large-node', isMjLarge);
                    node.innerHTML = '<div class="fixed-number">' + getSkinBits(i) + '</div>' + skinAssetHtml('cat', catId);
                }
                if (fish) {
                    const isMjFishLarge = currentSkin === 'mj' && i % 2 === 1 && !isRainbowMode;
                    fish.classList.toggle('large-node', isMjFishLarge);
                    fish.innerHTML = '<div class="fish-label">' + getSkinBits(i) + '</div>' + skinAssetHtml('fish', i);
                }
            }
            ensureDistanceBadges();
        }

        function getFeatureImageIndex(index) {
            return LAB_BITS === 2 ? index + 2 : index + 1;
        }

        function getFeatureSkinFolder() {
            if (currentSkin === 'rip') return './RIP/';
            if (currentSkin === 'poto') return './poto/';
            if (currentSkin === 'mj') return './mj/';
            return './svg/';
        }

        function updateCircuitLabels() {
            let inBin = null;
            let outBin = null;
            
            if (isTraceMode && activeTraceInput !== null) {
                const startNode = initialFishAtNode.indexOf(activeTraceInput);
                
                let currNode = startNode;
                for (let k = 0; k < currentTraceStep; k++) {
                    currNode = getPermutationForGate(gateHistory[k])[currNode];
                }
                
                inBin = startNode.toString(2).padStart(LAB_BITS, '0');
                outBin = currNode.toString(2).padStart(LAB_BITS, '0');
            }

            for (let i = 0; i < LAB_BITS; i++) {
                const qIn = document.getElementById(`q-in-${i}`);
                const qOut = document.getElementById(`q-out-${i}`);
                if (!qIn) continue;

                if (isTraceMode && isQuantumMode) {
                    if (labelsOpen) {
                        if (inBin && outBin) {
                            const inColor = inBin[i] === '1' ? '#FFB7C5' : '#7d6961';
                            const outColor = outBin[i] === '1' ? '#FFB7C5' : '#7d6961';
                            qIn.innerHTML = `<span style="color: ${inColor}; font-weight: 900; font-size: 24px;">${inBin[i]}</span>`;
                            if (qOut) {
                                qOut.innerHTML = `<span style="color: ${outColor}; font-weight: 900; font-size: 24px;">${outBin[i]}</span>`;
                                qOut.classList.remove('hidden-el');
                            }
                        } else {
                            qIn.innerHTML = `q${i}`;
                            if (qOut) qOut.classList.add('hidden-el');
                        }
                    } else {
                        const imgIndex = getFeatureImageIndex(i);
                        if (inBin && outBin) {
                            const inBorderColor = inBin[i] === '1' ? '#FFB7C5' : '#7d6961';
                            const outBorderColor = outBin[i] === '1' ? '#FFB7C5' : '#7d6961';

            const wrapperRect = wrapper.getBoundingClientRect();
            const threshold = 60;
            if (lastTouchX < wrapperRect.left + threshold) {
                scrollDirection = -1;
                autoScrollWrapper = wrapper;
                if (!autoScrollRAF) autoScrollRAF = requestAnimationFrame(handleAutoScroll);

        function handleOrientation(event) {
            if (!lockedLineId || lineMode === 1 || lineMode === 4) return;
            let tilt = event.gamma; 
            const orientation = (screen.orientation || {}).type || window.orientation;
            if (orientation === 90 || orientation === "landscape-primary") {
                tilt = event.beta;
            } else if (orientation === -90 || orientation === "landscape-secondary") {
                tilt = -event.beta;
            } else if (orientation === 180 || orientation === "portrait-secondary") {
                tilt = -event.gamma;
            }
            const now = Date.now();
            if (now - lastSwipeTime < 400) return;
            if (tilt > TILT_THRESHOLD && lastTiltDirection <= 0) {
                currentOptionIndex = (currentOptionIndex + 1) % currentOptions.length;
                lastTiltDirection = 1;
                lastSwipeTime = now;
                hasScrolled = true;
                showIndicator();
                if ('vibrate' in navigator) navigator.vibrate(20);
            } else if (tilt < -TILT_THRESHOLD && lastTiltDirection >= 0) {
                currentOptionIndex = (currentOptionIndex - 1 + currentOptions.length) % currentOptions.length;
                lastTiltDirection = -1;
                lastSwipeTime = now;
                hasScrolled = true;
                showIndicator();
                if ('vibrate' in navigator) navigator.vibrate(20);

            }

                    gateEdgeScrollDirection = -1;

                } else if (e.clientY < rect.bottom && e.clientY > rect.bottom - GATE_EDGE_THRESHOLD) {

                    const currentX = e.touches[0].clientX;
                    const currentY = e.touches[0].clientY;
                    const diffX = currentX - lastCanvasX;
                    const diffY = currentY - lastCanvasY;
                    if (Math.abs(currentX - canvasTouchStartX) > 8 || Math.abs(currentY - canvasTouchStartY) > 8) {
                        isCanvasSwiping = true;
                        if (e.cancelable) e.preventDefault();
                    }
                    if (isCanvasSwiping && currentOptions.length > 0) {
                        if (Math.abs(diffX) > Math.abs(diffY)) {
                            const steps = Math.floor(Math.abs(diffX) / 80);
                            if (steps > 0) {
                                const dir = diffX > 0 ? 1 : -1;
                                const shift = (dir * steps) % currentOptions.length;
                                currentOptionIndex = (((currentOptionIndex + shift) % currentOptions.length) + currentOptions.length) % currentOptions.length;

                if (!indicator.classList.contains('active') || isTouchDevice) return;

        function getRgba(hex, alpha) {

        function getGateColorMap(type) {

        function getHighlightPairsForGate(type) {
            const { ctrl, target, zero, swap } = parseGateSpec(type);
            const pairs = [];
            if (swap) return [swap];
            if (target === -1) return pairs;
            const targetMask = 1 << (2 - target);
            for (let k = 0; k < 8; k++) {
                if ((k & targetMask) !== 0) continue;
                const ok = ctrl.every(bit => {
                    const bitMask = 1 << (2 - bit);
                    const val = (k & bitMask) ? 1 : 0;
                    return zero.includes(bit) ? val === 0 : val === 1;
                });
                if (ok) pairs.push([k, k ^ targetMask]);
            }
            return pairs;
        }
        function getMiniHypercubeSVG(type, activeState = null) {
            const pairs = getHighlightPairsForGate(type);
            const xs = nodePositions.map(n => n.relX);
            const ys = nodePositions.map(n => n.t);
            const minX = Math.min(...xs), maxX = Math.max(...xs);
            const minY = Math.min(...ys), maxY = Math.max(...ys);
            const miniNodes = nodePositions.map(n => ({
                x: ((n.relX - minX) / (maxX - minX)) * 70 + 15,
                y: ((n.t - minY) / (maxY - minY)) * 70 + 15
            }));
            let svg = `<svg viewBox="0 0 100 100" style="width:100%; height:100%; pointer-events:none; display:block;" preserveAspectRatio="xMidYMid meet">`;
            for (let i = 0; i < 8; i++) {
                for (let b = 0; b < 3; b++) {
                    const j = i ^ (1 << b);
                    if (j > i) {
                        const n1 = miniNodes[i], n2 = miniNodes[j];
                        const hi = pairs.some(p => (p[0] === i && p[1] === j) || (p[0] === j && p[1] === i));
                        svg += `<line x1="${n1.x}" y1="${n1.y}" x2="${n2.x}" y2="${n2.y}" class="${hi ? 'hyper-line-hi' : 'hyper-line'}" style="stroke-width:${hi ? 5 : 1.2}" stroke-linecap="round"/>`;
                    }
                }
            }
            for (let i = 0; i < 8; i++) {
                const n = miniNodes[i];
                const isActive = (i === activeState);
                if (isActive) {
                    svg += `<circle cx="${n.x}" cy="${n.y}" r="6" fill="#f78790" stroke="#ffffff" stroke-width="2"/>`;
                } else {
                    svg += `<circle cx="${n.x}" cy="${n.y}" r="3.5" fill="#463438"/>`;
                }
            }
            svg += `</svg>`;
            return svg;
        }
        function getGateIcon(type) {

                const minQ = Math.min(...allQs), maxQ = Math.max(...allQs);
                content += `<div class="gate-v-line" style="top:${getY(minQ)}px; height:${(maxQ - minQ) * 18.5}px;"></div>`;

            ctrl.forEach(q => {

                content += `<div class="gate-dot ${isZero ? 'empty' : 'fill'}" style="top:${getY(q)}px;"></div>`;
            });
            if (target !== -1) content += `<div class="gate-target-circle" style="top:${getY(target)}px;"></div>`;

        function createLine(i, j, dim) {
            const n1 = nodePositions[i];
            const n2 = nodePositions[j];
            const x1 = n1.l + 65;
            const y1 = n1.t + 60;
            const x2 = n2.l + 65;
            const y2 = n2.t + 60;
            const len = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
            const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
            const line = document.createElement('div');
            line.className = 'connection-line';
            line.id = `line-${Math.min(i, j)}-${Math.max(i, j)}`;
            line.style.cssText = `width:${len}px; height:4px; background:#463438; left:${x1}px; top:${y1}px; transform:rotate(${ang}deg); transform-origin:0 50%;`;
            
            line.onmouseenter = () => {
                if (isTouchDevice || lockedLineId) return;
                hoverLine = { i, j, dim };
                
                if (lineMode === 4) {
                    const targetBit = 2 - dim;
                    highlightPairs(getAllPairs(dim));
                    highlightGateButton(`X_${targetBit}`);
                } else if (lineMode === 1) {
                    const targetBit = 2 - dim;
                    const otherBits = [0, 1, 2].filter(b => b !== targetBit);
                    const cv1 = (i & (1 << (2 - otherBits[0]))) ? 1 : 0;
                    const cv2 = (i & (1 << (2 - otherBits[1]))) ? 1 : 0;
                    const gateType = `TOF_${cv1}_${cv2}_${otherBits[0]}_${otherBits[1]}_${targetBit}`;

                    highlightPairs([[i, j]]);
                    highlightGateButton(gateType);
                } else {
                    highlightPairs([[i, j]]);
                }
            };
            
            line.onmouseleave = () => {
                if (isTouchDevice || lockedLineId) return;
                hoverLine = null;
                hideIndicator();
            };

            line.onclick = e => {
                e.stopPropagation();

                if (lineMode === 1) {
                    const targetBit = 2 - dim;
                    const otherBits = [0, 1, 2].filter(b => b !== targetBit);
                    const cv1 = (i & (1 << (2 - otherBits[0]))) ? 1 : 0;
                    const cv2 = (i & (1 << (2 - otherBits[1]))) ? 1 : 0;
                    applyGate(`TOF_${cv1}_${cv2}_${otherBits[0]}_${otherBits[1]}_${targetBit}`);
                    return;
                }

                if (lineMode === 4 && !isTouchDevice) {
                    const targetBit = 2 - dim;
                    applyGate(`X_${targetBit}`);
                    return;
                }

                if (lockedLineId === line.id) {
                    cancelLock();
                    return;
                }

                lockedLineId = line.id;

                showIndicatorLockedPrompt();
            };
            document.getElementById('lines-layer').appendChild(line);

        function hideIndicator() {
            const ind = document.getElementById('ios-indicator');

        function buildGateOptions(i, j, dim) {
            const diff = i ^ j;
            const targetBit = diff === 4 ? 0 : diff === 2 ? 1 : 2;
            const otherBits = [0, 1, 2].filter(b => b !== targetBit);
            const options = [];
            if (lineMode === 4) {
                options.push({ gateType: `X_${targetBit}`, label: `X Gate: q${targetBit}`, highlightPairs: getAllPairs(dim) });
            } else if (lineMode === 2) {
                otherBits.forEach(ctrlBit => {
                    const ctrlMask = 1 << (2 - ctrlBit);
                    const ctrlVal = (i & ctrlMask) ? 1 : 0;
                    const gateType = `CX_${ctrlVal}_${ctrlBit}_${targetBit}`;
                    let pairs = [];
                    const bit = 1 << (2 - targetBit);
                    for (let k = 0; k < 8; k++) {
                        if ((k & bit) === 0 && ((k & ctrlMask) ? 1 : 0) === ctrlVal) pairs.push([k, k ^ bit]);
                    }
                    options.push({ gateType, label: `CNOT: q${ctrlBit}=${ctrlVal} → q${targetBit}`, highlightPairs: pairs });
                });
            }
            return options;
        }

        function convertToLevel8Format(g) {
            const p = g.split('_');

            if (p[0] === 'CX') return p[1] === '0' ? `C0X${p[2]}${p[3]}` : `CX${p[2]}${p[3]}`;
            if (p[0] === 'TOF') {

                const p2 = p[2] === '0' ? 'p' : '';

            }
            return g;
        }
        function normalizeGateType(type) {
            type = String(type || '').trim();
            return type.includes('_') ? convertToLevel8Format(type) : type;
        }
        function getGateButtonId(type) {
            const { kind, ctrl, target, zero } = parseGateSpec(type);
            if (kind === 'X') return `X_${target}`;
            if (kind === 'CX') {
                const c = ctrl[0];
                return `CX_${zero.includes(c) ? 0 : 1}_${c}_${target}`;
            }
            if (kind === 'TOF') {
                const c1 = ctrl[0], c2 = ctrl[1];
                return `TOF_${zero.includes(c1) ? 0 : 1}_${zero.includes(c2) ? 0 : 1}_${c1}_${c2}_${target}`;
            }
            return type;
        }
        function parseGateSpec(type) {
            const gate = normalizeGateType(String(type || '').trim());
            let ctrl = [];
            let target = -1;
            let zero = [];
            let swap = null;
            let kind = '';
            if (gate.startsWith('SWAP_')) {
                const p = gate.split('_').map(Number);
                swap = [p[1], p[2]];
                const diff = p[1] ^ p[2];
                if (diff > 0 && (diff & (diff - 1)) === 0) {
                    target = 2 - Math.round(Math.log2(diff));
                    const low = Math.min(p[1], p[2]).toString(2).padStart(3, '0').split('').map(Number);
                    for (let q = 0; q < 3; q++) {
                        if (q === target) continue;
                        ctrl.push(q);
                        if (low[q] === 0) zero.push(q);
                    }
                }
                kind = 'SWAP';
            } else if (gate.startsWith('X')) {
                target = parseInt(gate[1]);
                kind = 'X';
            } else if (gate.startsWith('C0X')) {
                ctrl = [parseInt(gate[3])];
                target = parseInt(gate[4]);
                zero = [parseInt(gate[3])];
                kind = 'CX';
            } else if (gate.startsWith('CX')) {

                    const ctrlVal = parseInt(gate[2]);
                    const ctrlBit = parseInt(gate[3]);
                    ctrl = [ctrlBit];
                    target = parseInt(gate[4]);
                    if (ctrlVal === 0) zero = [ctrlBit];
                } else {
                    ctrl = [parseInt(gate[2])];
                    target = parseInt(gate[3]);
                }
                kind = 'CX';
            } else if (gate.startsWith('TOF')) {
                const s = gate.replace('TOF', '');
                let parts = [];
                for (let i = 0; i < s.length; i++) {
                    if (s[i + 1] === 'p') {
                        parts.push({ v: parseInt(s[i]), z: true });
                        i++;
                    } else {
                        parts.push({ v: parseInt(s[i]), z: false });
                    }
                }
                target = parts.pop().v;
                parts.forEach(p => {
                    ctrl.push(p.v);
                    if (p.z) zero.push(p.v);
                });
                kind = 'TOF';
            }
            return { gate, kind, ctrl, target, zero, swap };

            const spec = parseGateSpec(type);

            }
            const circuitData = gateHistory.join(',');
            let shareUrl = `${window.location.origin}${window.location.pathname}?circuit=${encodeURIComponent(circuitData)}`;
            const defaultInput = Array.from({ length: LAB_TOTAL }, (_, i) => i).join(',');
            if (initialFishAtNode.join(',') !== defaultInput) {
                shareUrl += `&input=${initialFishAtNode.join(',')}`;
            }
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('Circuit sharing link copied! Send it to a friend to open this circuit.');
            }).catch(err => {
                console.error('Failed to copy link', err);
                alert('Link: ' + shareUrl);
            });
        }
    </script>
</body>
</html>
