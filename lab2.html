        .skin-poto.hide-labels .fish-wrapper > img.fish-img, .skin-poto.hide-labels .fish-wrapper > img.fish-bg-shape { transform: translateY(-14%) translateX(10%) scale(1.15) !important; }

        .skin-mj.hide-labels .fish-wrapper > img.fish-img, .skin-mj.hide-labels .fish-wrapper > img.fish-bg-shape { transform: translate(-5px, -21%) scale(1.05) !important; }
        .skin-mj .fish-wrapper.large-node > img.fish-img, .skin-mj .fish-wrapper.large-node > img.fish-bg-shape { transform: translate(10px, -38%) scale(0.92)!important; }
        .skin-mj.hide-labels .fish-wrapper.large-node > img.fish-img, .skin-mj.hide-labels .fish-wrapper.large-node > img.fish-bg-shape { transform: translate(10px, -24%) scale(1) !important; }

        body.skin-rainbow img.fish-img { top: 8px !important; right: 5px !important; }

<body id="body-root" class="pro-active mini-mode preload hide-labels">

                        <button id="gate-x0" class="gate-btn-v2 btn-not" onclick="applyGate('X0')" onmouseover="syncGateHighlight('X0', true)" onmouseout="syncGateHighlight('X0', false)"></button>

                        <button id="gate-c0x10" class="gate-btn-v2 btn-cnot" onclick="applyGate('C0X10')" onmouseover="syncGateHighlight('C0X10', true)" onmouseout="syncGateHighlight('C0X10', false)"></button>
                        <button id="gate-c0x01" class="gate-btn-v2 btn-cnot" onclick="applyGate('C0X01')" onmouseover="syncGateHighlight('C0X01', true)" onmouseout="syncGateHighlight('C0X01', false)"></button>
                    </div>
                    <div class="mt-auto w-full pt-2">

                        <button id="undo-btn" class="func-btn btn-undo" onclick="undo()">Undo Step</button>
                    </div>

                <div id="tt-view-container" class="w-full flex-col hidden-el h-full flex" style="max-height: 100%; overflow: hidden;">
                    <div class="panel-section-title shrink-0 mt-2">Truth Table</div>
                    <div id="tt-header-row" class="text-sm text-gray-400 mb-2 mt-4 font-bold flex justify-between px-2 shrink-0 border-b border-gray-300 pb-2 w-full mx-auto" style="box-sizing: border-box;">
                        <span class="w-1/3 text-center text-black">NO.</span>

                <div id="trace-controls" class="hidden-el shrink-0 w-full mt-auto flex gap-1 items-center bg-gray-100 p-2 rounded-2xl border-4 border-black shadow-[0_4px_0_0_rgba(0,0,0,0.1)] transition-opacity">
                    <button id="trace-prev-btn" class="func-btn btn-reset m-0 py-2 px-1 text-xs hover:bg-yellow-200 flex-1" style="box-shadow: 0 2px 0 #000;" onclick="traceMove(-1)">◀</button>
                    <div class="flex flex-col items-center justify-center px-1 min-w-[50px]">
                        <span class="text-[14px] font-black leading-none" style="color: #99C44D;">STEP</span>

                    <button id="trace-next-btn" class="func-btn btn-reset m-0 py-2 px-1 text-xs hover:bg-yellow-200 flex-1" style="box-shadow: 0 2px 0 #000;" onclick="traceMove(1)">▶</button>
                    <button class="func-btn btn-red m-0 py-1 px-1 text-xs text-white border-black flex-1" style="box-shadow: 0 2px 0 #000; display:flex; align-items:center; justify-content:center;" onclick="restartTrace()">↻</button>

                <div id="line-h-1" class="connection-line line-h" style="bottom: 90px;" onclick="handleLineClick(this.id)" onmouseover="syncHighlight(this.id, true)" onmouseout="syncHighlight(this.id, false)"></div>
                <div id="line-v-0" class="connection-line line-v" style="top: 150px;" onclick="handleLineClick(this.id)" onmouseover="syncHighlight(this.id, true)" onmouseout="syncHighlight(this.id, false)"></div>
                <div id="line-v-1" class="connection-line line-v" style="top: 150px;" onclick="handleLineClick(this.id)" onmouseover="syncHighlight(this.id, true)" onmouseout="syncHighlight(this.id, false)"></div>
                
                <div class="node" id="node-0" style="top: 25px;"></div>

        <div id="circuit-area" class="mx-auto">
            <div class="circuit-title">Paths</div>
            <div id="q-in-0" class="qubit-label" style="top: 73px; transform: translateY(-50%);"></div>
            <div id="q-in-1" class="qubit-label" style="top: 120px; transform: translateY(-50%);"></div>
            <div id="q-out-0" class="qubit-label right-side hidden-el" style="top: 73px; transform: translateY(-50%);"></div>
            <div id="q-out-1" class="qubit-label right-side hidden-el" style="top: 120px; transform: translateY(-50%);"></div>

    <script>
        let initialFishAtNode = [0, 1, 2, 3];
        let fishAtNode = [0, 1, 2, 3];
        let gateHistory = [], historyStack = [[]];
        let selectedIndices = [], draggedIndex = null;
        let isMode2 = false;
        let isQuantumMode = false; 
        let isTraceMode = false;
        let isRainbowMode = false;
        let activeTraceInput = null;
        let currentTraceStep = 0;
        const pop = new Audio('pop.m4a');
        let isTouchDevice = false;
        let mobileDragging = false;
        let mDragIndex = null;
        let dragGhost = null;
        let gyroPermissionGranted = false;
        window.addEventListener('touchstart', () => { isTouchDevice = true; }, {once: true});
        
        let autoScrollRAF = null;
        let scrollSpeed = 0;
        let labelsOpen = false;
        const LAB_TOTAL = 4;
        const LAB_BITS = 2;
        const SKIN_STORAGE_KEY = 'meowtopiaSkin';
        const AVAILABLE_SKINS = ['default', 'rip', 'poto', 'mj'];
        let currentSkin = 'default';
        let featureStates = Array(LAB_BITS).fill(null);

        function playPopSound() {
            if(typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(e=>{}); }
        }

        function editInitialInput() {
            playPopSound();
            const modal = document.getElementById('input-modal');
            const inputField = document.getElementById('initial-input-field');
            if (!modal || !inputField) return;
            inputField.value = initialFishAtNode.join(', ');
            modal.classList.remove('hidden-el');
            setTimeout(() => inputField.focus(), 0);
        }

        function closeInputModal() {
            playPopSound();
            const modal = document.getElementById('input-modal');
            if (modal) modal.classList.add('hidden-el');
        }

        function saveInitialInput() {
            playPopSound();
            const inputField = document.getElementById('initial-input-field');
            const res = inputField ? inputField.value : '';
            if (!res) return;
            const parsed = res.replace(/\s/g, '').split(',').map(Number);
            const isValid = parsed.length === LAB_TOTAL &&
                new Set(parsed).size === LAB_TOTAL &&
                parsed.every(n => Number.isInteger(n) && n >= 0 && n < LAB_TOTAL);
            if (!isValid) {
                alert(`Invalid format. Enter ${LAB_TOTAL} unique numbers from 0 to ${LAB_TOTAL - 1}, for example: ${Array.from({ length: LAB_TOTAL }, (_, i) => i).join(',')}`);
                return;
            }
            initialFishAtNode = parsed;
            activeTraceInput = null;
            currentTraceStep = 0;
            recalculatePositions();
            updateLabels();
            finishMove();
            closeInputModal();
        }

        function toggleRainbowMode() {
            playPopSound();
            isRainbowMode = !isRainbowMode;
            if (isRainbowMode) {
                featureStates.fill(null);
            }
            updateFeatureToggleLabels();
            updateFeatureHighlights();

            refreshSkinAssets();
            updateTruthTable();
            updateFishUI();
        }

        function getSkinBits(index, count = LAB_TOTAL) {
            return index.toString(2).padStart(count > 8 ? 4 : count > 4 ? 3 : 2, '0');
        }

        function defaultSkinCode(index, count = LAB_TOTAL) {
            const bits = getSkinBits(index, count);
            if (count > 8) return '0' + bits.slice(2);
            if (count > 4) return bits;
            return '0' + bits;
        }

        function defaultSkinHat(kind, index, count = LAB_TOTAL) {
            if (count <= 8) return '';
            const bits = getSkinBits(index, count);
            if (bits[1] !== '1') return '';
            const asset = kind === 'cat' ? 'hat-c' : 'hat-f';
            const cls = kind === 'cat' ? 'cat-hat' : 'fish-hat';
            return '<img src="./svg/' + asset + '.svg" class="hat-img ' + cls + ' hat-bg-shape" alt=""><img src="./svg/' + asset + '.svg" class="hat-img ' + cls + '" alt="">';
        }

        function defaultSkinFaded(index, count = LAB_TOTAL) {
            return count > 8 && getSkinBits(index, count)[0] === '1' ? ' bit-faded' : '';
        }

        function catLayerHtml(src, className, alt) {
            return '<img src="' + src + '" class="' + className + ' cat-bg-shape" alt=""><img src="' + src + '" class="' + className + '" alt="' + alt + '">';
        }

        function fishLayerHtml(src, faded, alt) {
            return '<img src="' + src + '" class="fish-bg-shape encoded-img' + faded + '" alt=""><img src="' + src + '" class="fish-img encoded-img' + faded + '" alt="' + alt + '">';
        }

        function skinAssetHtml(kind, index, count = LAB_TOTAL, label) {
            const text = label || getSkinBits(index, count);
            
            if (isRainbowMode) {
                const src = './image/' + (kind === 'cat' ? 'Cat' : 'Fish') + (index + 1) + '.svg';
                return kind === 'cat'
                    ? '<img src="' + src + '" class="skin-cat" alt="' + text + ' cat">'
                    : '<img src="' + src + '" class="fish-img" alt="' + text + ' fish">';
            }

            if (currentSkin === 'rip') {
                const src = './RIP/' + (kind === 'cat' ? 'Cat' : 'Fish') + (index + 1) + '.png';
                return kind === 'cat' ? catLayerHtml(src, 'skin-cat encoded-img', text + ' cat') : fishLayerHtml(src, '', text + ' fish');
            }
            if (currentSkin === 'poto') {
                const src = './poto/' + (kind === 'cat' ? 'cat' : 'fish') + index + '.png';
                return kind === 'cat' ? catLayerHtml(src, 'skin-cat encoded-img', text + ' cat') : fishLayerHtml(src, '', text + ' fish');
            }
            if (currentSkin === 'mj') {
                const src = './mj/' + (kind === 'cat' ? 'Cat' : 'Fish') + index + '.png';
                return kind === 'cat' ? catLayerHtml(src, 'skin-cat encoded-img', text + ' cat') : fishLayerHtml(src, '', text + ' fish');
            }
            const code = defaultSkinCode(index, count);
            const faded = defaultSkinFaded(index, count);
            if (kind === 'cat') {
                return defaultSkinHat('cat', index, count) + catLayerHtml('./svg/' + code + '-c.svg', 'skin-cat encoded-img' + faded, text + ' cat');
            }
            return defaultSkinHat('fish', index, count) + fishLayerHtml('./svg/' + code + '-f.svg', faded, text + ' fish');
        }

        function truthSpriteHtml(kind, index) {
            const isMjLarge = (currentSkin === 'mj' && index % 2 === 1 && !isRainbowMode);
            const extraClass = isMjLarge ? ' large-node' : '';
            return '<span class="truth-sprite' + extraClass + '">' + skinAssetHtml(kind, index, LAB_TOTAL, getSkinBits(index)) + '</span>';
        }

        function initSkinFromUser(urlParams) {
            const passedSkin = urlParams.get('skin') || sessionStorage.getItem(SKIN_STORAGE_KEY);
            currentSkin = AVAILABLE_SKINS.includes(passedSkin) ? passedSkin : 'default';
            sessionStorage.setItem(SKIN_STORAGE_KEY, currentSkin);
        }

        function applySkinClass() {
            const root = document.getElementById('body-root') || document.body;
            ['default', 'rip', 'poto', 'mj'].forEach(skin => {
                root.classList.toggle('skin-' + skin, !isRainbowMode && currentSkin === skin && skin !== 'default');
                const option = document.getElementById('skin-option-' + skin);
                if (option) option.classList.toggle('active', currentSkin === skin);
            });
            root.classList.toggle('skin-rainbow', isRainbowMode);
        }

        function refreshSkinAssets() {
            applySkinClass();
            for (let i = 0; i < LAB_TOTAL; i++) {
                const node = document.getElementById('node-' + i);
                const fish = document.getElementById('fish-' + i);
                const isMjLarge = (currentSkin === 'mj' && i % 2 === 1 && !isRainbowMode);
                if (node) {
                    node.classList.toggle('large-node', isMjLarge);
                    node.innerHTML = '<div class="fixed-number">' + getSkinBits(i) + '</div>' + skinAssetHtml('cat', i);
                }
                if (fish) {
                    fish.classList.toggle('large-node', isMjLarge);
                    fish.innerHTML = '<div class="fish-label">' + getSkinBits(i) + '</div>' + skinAssetHtml('fish', i);
                }
            }
            ensureDistanceBadges();
        }

        function getFeatureImageIndex(index) {
            return LAB_BITS === 2 ? index + 2 : index + 1;
        }

        function getFeatureSkinFolder() {
            if (currentSkin === 'rip') return './RIP/';
            if (currentSkin === 'poto') return './poto/';
            if (currentSkin === 'mj') return './mj/';
            return './svg/';
        }

        function updateCircuitLabels() {
            let inBin = null;
            let outBin = null;

            if (isTraceMode && activeTraceInput !== null) {
                const startNode = initialFishAtNode.indexOf(activeTraceInput);
                if (startNode !== -1) {
                    let currNode = startNode;
                    for (let k = 0; k < currentTraceStep; k++) {
                        currNode = getPermutationForGate(gateHistory[k])[currNode];
                    }
                    inBin = startNode.toString(2).padStart(LAB_BITS, '0');
                    outBin = currNode.toString(2).padStart(LAB_BITS, '0');
                }
            }

            const makeNumBox = (val, color) => `<div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: ${color}; font-weight: 900; font-size: 28px;">${val}</div>`;
            const makeDifBox = (imgIndex, borderColor) => `<div style="width: 48px; height: 48px; border: 4px solid ${borderColor}; border-radius: 12px; background: white; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0;"><img src="${getFeatureSkinFolder()}dif${imgIndex}.png" style="width: 38px; height: 38px; object-fit: contain;" alt="dif${imgIndex}"></div>`;

            for (let i = 0; i < LAB_BITS; i++) {

        function updateScrollSpeed(clientX) {
            const wrapper = document.getElementById('circuit-content-wrapper');
            if (!wrapper) return;
            const rect = wrapper.getBoundingClientRect();
            const edgeThreshold = 120;
            const maxSpeed = 13;

            if (clientX - rect.left < edgeThreshold) {
                let intensity = 1 - Math.max(0, clientX - rect.left) / edgeThreshold;
                scrollSpeed = -(maxSpeed * Math.pow(intensity, 1.5));
                if (!autoScrollRAF) autoScrollRAF = requestAnimationFrame(scrollLoop);
            } else if (rect.right - clientX < edgeThreshold) {
                let intensity = 1 - Math.max(0, rect.right - clientX) / edgeThreshold;
                scrollSpeed = maxSpeed * Math.pow(intensity, 1.5);
                if (!autoScrollRAF) autoScrollRAF = requestAnimationFrame(scrollLoop);
            } else {
                scrollSpeed = 0;
            }
        }

        function scrollLoop() {
            const wrapper = document.getElementById('circuit-content-wrapper');
            if (scrollSpeed !== 0) {
                wrapper.scrollLeft += scrollSpeed;
                autoScrollRAF = requestAnimationFrame(scrollLoop);
            } else {
                autoScrollRAF = null;
            }
        }

        function getRgba(hex, alpha) {
            hex = hex.replace('#', '');
            const r = parseInt(hex.substring(0,2), 16), g = parseInt(hex.substring(2,4), 16), b = parseInt(hex.substring(4,6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        
        function getGateColorMap(type) {
            if (type.startsWith('X')) return '#629eed'; 
            return '#e2de6e'; 
        }

        function getHighlightPairsForGate(type) {
            let pairs = [];
            if (type === 'X0') pairs = [[0,2], [1,3]];
            else if (type === 'X1') pairs = [[0,1], [2,3]];
            else if (type === 'CX01') pairs = [[2,3]];
            else if (type === 'C0X01') pairs = [[0,1]];
            else if (type === 'CX10') pairs = [[1,3]];
            else if (type === 'C0X10') pairs = [[0,2]];
            return pairs;
        }

        function getMiniSquareSVG(type, activeState = null) {
            let pairs = getHighlightPairsForGate(type);
            const miniNodes = [
                { x: 20, y: 20 }, 
                { x: 80, y: 20 }, 
                { x: 20, y: 80 }, 
                { x: 80, y: 80 }  
            ];
            let svg = `<svg viewBox="0 0 100 100" style="width:100%; height:100%; pointer-events:none; display: block;" preserveAspectRatio="xMidYMid meet">`;
            const edges = [ [0, 1], [0, 2], [1, 3], [2, 3] ];
            edges.forEach(([i, j]) => {
                let n1 = miniNodes[i], n2 = miniNodes[j];
                let isHighlighted = pairs.some(p => (p[0] === i && p[1] === j) || (p[0] === j && p[1] === i));
                let lineClass = isHighlighted ? 'hyper-line-hi' : 'hyper-line';
                let strokeW = isHighlighted ? 4.5 : 2;
                svg += `<line x1="${n1.x}" y1="${n1.y}" x2="${n2.x}" y2="${n2.y}" class="${lineClass}" style="stroke-width: ${strokeW}" stroke-linecap="round"/>`;
            });
            for(let i=0; i<4; i++) {
                let n = miniNodes[i];
                let isTraceNode = (activeState !== null && i === activeState);
                if (isTraceNode) {
                    svg += `<circle cx="${n.x}" cy="${n.y}" r="9" fill="#f78790" stroke="#FFF9F0" stroke-width="2"/>`;
                } else {
                    svg += `<circle cx="${n.x}" cy="${n.y}" r="6" fill="#463438"/>`;
                }
            }
            svg += `</svg>`;
            return svg;
        }

                    if (mDragIndex < finalIdx) finalIdx--;
                    
                    if (mDragIndex !== finalIdx) {
                        if (typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(e=>{}); }
                        const movedItem = gateHistory.splice(mDragIndex, 1)[0];
                        gateHistory.splice(finalIdx, 0, movedItem);
                        pushHistory();
                        selectedIndices = [];
                        recalculatePositions();
                        finishMove();
                    }
                }
            }
            mDragIndex = null;
            scrollSpeed = 0;
        }

        function initLabData() {
            const urlParams = new URLSearchParams(window.location.search);
            initSkinFromUser(urlParams);
            
            const sharedInput = urlParams.get('input');
            if (sharedInput) {
                let parsed = sharedInput.split(',').map(Number);
                if (parsed.length === 4 && new Set(parsed).size === 4 && parsed.every(n => !isNaN(n) && n >= 0 && n <= 3)) {
                    initialFishAtNode = parsed;
                }
            }

            const sharedCircuit = urlParams.get('circuit');
            if (sharedCircuit) {
                gateHistory = sharedCircuit.split(',').filter(g => g !== "");
                historyStack.push([...gateHistory]);
            } else {
                const savedCircuit = sessionStorage.getItem('labCircuit');
                if (savedCircuit) {
                    gateHistory = savedCircuit.split(',').filter(g => g !== "");
                    historyStack.push([...gateHistory]);
                }
            }
        }

        function toggleTraceMode() {
            if(typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(e=>{}); }
            isTraceMode = !isTraceMode;
            const btn = document.getElementById('view-toggle-btn');
            const gView = document.getElementById('gate-view-container');
            const tView = document.getElementById('tt-view-container');
            const tCtrl = document.getElementById('trace-controls');
            if (isTraceMode) {
                btn.innerText = "Trace: ON";
                btn.classList.add('trace-active-btn');
                gView.classList.add('hidden-el');
                tView.classList.remove('hidden-el');
                tCtrl.classList.remove('hidden-el');
                
                activeTraceInput = null;
                currentTraceStep = 0;
                
                updateLabels();
                updateTruthTable();
                renderTraceStep();
            } else {
                btn.innerText = "Trace: OFF";
                btn.classList.remove('trace-active-btn');
                gView.classList.remove('hidden-el');
                tView.classList.add('hidden-el');
                tCtrl.classList.add('hidden-el');
                
                activeTraceInput = null;
                document.querySelectorAll('.trace-line-active').forEach(el => el.classList.remove('trace-line-active'));
                document.querySelectorAll('.trace-fish-active').forEach(el => el.classList.remove('trace-fish-active'));
                
                updateLabels();
                updateTruthTable();
                finishMove();
            }
        }

        function restartTrace() {
            if(typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(e=>{}); }
            currentTraceStep = 0;
            renderTraceStep();
        }

        function startTrace(inputIndex) {
            if(typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(e=>{}); }
            if (activeTraceInput === inputIndex) {
                activeTraceInput = null;
                currentTraceStep = 0;
            } else {
                activeTraceInput = inputIndex;
                currentTraceStep = 0;
            }
            updateTruthTable();
            renderTraceStep();
        }

        function traceMove(delta) {
            if(typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(e=>{}); }
            currentTraceStep += delta;
            if (currentTraceStep < 0) currentTraceStep = 0;
            if (currentTraceStep > gateHistory.length) currentTraceStep = gateHistory.length;
            renderTraceStep();
        }

        function getLineId(n1, n2) {
            const min = Math.min(n1, n2), max = Math.max(n1, n2);
            if (min === 0 && max === 1) return 'line-h-0';
            if (min === 2 && max === 3) return 'line-h-1';
            if (min === 0 && max === 2) return 'line-v-0';
            if (min === 1 && max === 3) return 'line-v-1';
            return null;
        }

        function renderTraceStep() {
            let currentBoardState = [...initialFishAtNode];
            for (let k = 0; k < currentTraceStep; k++) {
                let pm = getPermutationForGate(gateHistory[k]);
                let next = new Array(4);
                for (let i = 0; i < 4; i++) next[pm[i]] = currentBoardState[i];
                currentBoardState = next;
            }

            for (let i = 0; i < 4; i++) {
                let f = document.getElementById(`fish-${currentBoardState[i]}`);
                let n = document.getElementById(`node-${i}`);
                if (f && n) {
                    f.style.top = (n.offsetTop + 75) + "px";
                    f.style.left = (n.offsetLeft + 30) + "px";
                }
                const nodeEl = document.getElementById(`node-${i}`);
                if (nodeEl) nodeEl.classList.toggle('node-correct', currentBoardState[i] === i);
            }

            document.querySelectorAll('.trace-line-active').forEach(el => el.classList.remove('trace-line-active'));
            document.querySelectorAll('.trace-fish-active').forEach(el => el.classList.remove('trace-fish-active'));

            if (activeTraceInput !== null) {
                let f = document.getElementById(`fish-${activeTraceInput}`);
                if (f) f.classList.add('trace-fish-active');

                let trackedFishId = activeTraceInput;
                let startNode = initialFishAtNode.indexOf(trackedFishId);
                let prevNode = startNode;
                let currNode = startNode;
                for(let k = 0; k < currentTraceStep; k++) {
                    prevNode = currNode;
                    let pm = getPermutationForGate(gateHistory[k]);
                    currNode = pm[currNode];
                }
                if (currentTraceStep > 0 && prevNode !== currNode) {
                    let lineId = getLineId(prevNode, currNode);
                    let lineEl = document.getElementById(lineId);
                    if (lineEl) lineEl.classList.add('trace-line-active');
                }
            } else {
                if (currentTraceStep > 0) {
                    let lastGate = gateHistory[currentTraceStep - 1];
                    let lines = gateLineMap[lastGate] || [];
                    lines.forEach(id => {
                        let lineEl = document.getElementById(id);
                        if (lineEl) lineEl.classList.add('trace-line-active');
                    });
                }
            }

            updateFishVisibility();
            updateLabels();
            document.getElementById('trace-step-text').innerText = currentTraceStep;
            renderCircuit();
            
            const activeGate = document.querySelector('.circuit-unit.trace-active');
            if (activeGate) {
                activeGate.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
            updateFeatureHighlights();

            const prevBtn = document.getElementById('trace-prev-btn');
            const nextBtn = document.getElementById('trace-next-btn');
            if (prevBtn) {
                prevBtn.disabled = false;
                prevBtn.style.opacity = '1';
                prevBtn.style.cursor = 'pointer';
            }
            if (nextBtn) {
                nextBtn.disabled = false;
                nextBtn.style.opacity = '1';
                nextBtn.style.cursor = 'pointer';
            }
            updateTruthTable();
        }

        function updateFishVisibility() {
            for (let i = 0; i < 4; i++) {
                let f = document.getElementById(`fish-${i}`);
                if (!f) continue;
                if (activeTraceInput !== null) {
                    let trackedFishId = activeTraceInput;
                    if (i === trackedFishId) {
                        f.style.setProperty('opacity', '1', 'important');
                        f.style.zIndex = 40;
                    } else {
                        f.style.setProperty('opacity', '0', 'important');
                        f.style.zIndex = 30;
                    }
                } else {
                    f.style.removeProperty('opacity');
                    f.style.zIndex = 30;
                }
            }
        }

        function updateTruthTable() {
            const isCustom = initialFishAtNode.some((val, idx) => val !== idx);
            const headerRow = document.getElementById('tt-header-row');
            if (headerRow) {
                if (isCustom) {
                    headerRow.innerHTML = `
                        <span class="w-1/4 text-center text-black">${labelsOpen ? 'ID' : 'FISH'}</span>
                        <span id="tt-head-left" class="w-1/4 text-center text-black">${labelsOpen ? 'IN' : 'START'}</span>
                        <span id="tt-head-right" class="w-1/4 text-center text-black">${labelsOpen ? 'OUT' : 'NOW'}</span>
                        <span class="w-1/4 text-center text-black">${labelsOpen ? 'TARGET' : 'HOME'}</span>
                    `;
                } else {
                    headerRow.innerHTML = `
                        <span class="w-1/3 text-center text-black">${labelsOpen ? 'ID' : 'FISH'}</span>
                        <span id="tt-head-left" class="w-1/3 text-center text-black">${labelsOpen ? 'IN' : 'START'}</span>
                        <span id="tt-head-right" class="w-1/3 text-center text-black">${labelsOpen ? 'OUT' : 'NOW'}</span>
                    `;
                }
            }

            const tbody = document.getElementById('tt-body');
            tbody.innerHTML = '';
            for (let i = 0; i < LAB_TOTAL; i++) {
                const startNode = initialFishAtNode.indexOf(i);
                if (startNode === -1) continue;

                let currNode = startNode;
                const stepLimit = isTraceMode ? currentTraceStep : gateHistory.length;
                for (let k = 0; k < stepLimit; k++) {
                    currNode = getPermutationForGate(gateHistory[k])[currNode];
                }

                const targetNode = i;
                const inStr = i.toString(2).padStart(LAB_BITS, '0');
                const outStr = currNode.toString(2).padStart(LAB_BITS, '0');
                const targetStr = targetNode.toString(2).padStart(LAB_BITS, '0');
                const isActive = activeTraceInput === i;
                const isChanged = startNode !== currNode;
                const outColor = isActive ? '' : (isChanged ? 'text-[#99C44D] font-bold' : 'text-gray-300');
                const rowClasses = [];
                if (isActive) rowClasses.push('active-trace');

                let indexCell, inputCell, outputCell, targetCell;
                if (labelsOpen) {
                    indexCell = i;
                    inputCell = inStr;
                    outputCell = outStr;
                    targetCell = targetStr;
                } else {
                    indexCell = truthSpriteHtml('fish', i);
                    inputCell = truthSpriteHtml('cat', i);
                    outputCell = truthSpriteHtml('cat', currNode);
                    targetCell = truthSpriteHtml('cat', targetNode);
                }

                if (isCustom) {
                    tbody.innerHTML += `
                        <tr class="${rowClasses.join(' ')}" onclick="startTrace(${i})">
                            <td class="py-2 text-base w-1/4 text-center align-middle">${indexCell}</td>
                            <td class="py-2 text-base w-1/4 text-center align-middle">${inputCell}</td>
                            <td class="py-2 text-base w-1/4 text-center align-middle ${outColor}">${outputCell}</td>
                            <td class="py-2 text-base w-1/4 text-center align-middle font-bold text-gray-400">${targetCell}</td>
                        </tr>`;
                } else {
                    tbody.innerHTML += `
                        <tr class="${rowClasses.join(' ')}" onclick="startTrace(${i})">
                            <td class="py-2 text-base w-1/3 text-center align-middle">${indexCell}</td>
                            <td class="py-2 text-base w-1/3 text-center align-middle">${inputCell}</td>
                            <td class="py-2 text-base w-1/3 text-center align-middle ${outColor}">${outputCell}</td>
                        </tr>`;
                }
            }
        }

        function toggleMode2() {
            if(typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(e=>{}); }
            isMode2 = !isMode2;
            const btn = document.getElementById('mode-2-btn');
            btn.innerText = isMode2 ? "Mode: 2" : "Mode: 1";
            btn.classList.toggle('mode2-active-btn', isMode2);
            document.querySelectorAll('.connection-line').forEach(el => el.classList.remove('line-highlight'));
            document.querySelectorAll('.btn-highlight').forEach(el => el.classList.remove('btn-highlight'));
        }

        function toggleLineHighlight(lineIds, isOn) {
            lineIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('line-highlight', isOn);
            });
        }

        function getGateForLine(lineId) {
            if (isMode2) {
                if (lineId.includes('h')) return 'X1';
                if (lineId.includes('v')) return 'X0';
            } else {
                if (lineId === 'line-h-0') return 'C0X01';
                if (lineId === 'line-h-1') return 'CX01';
                if (lineId === 'line-v-0') return 'C0X10';
                if (lineId === 'line-v-1') return 'CX10';
            }
            return null;
        }

        function syncHighlight(lineId, isOn) {
            const gate = getGateForLine(lineId);
            if (!gate) return;
            toggleLineHighlight(gateLineMap[gate] || [], isOn);
            const btn = document.getElementById('gate-' + gate.toLowerCase());
            if (btn) {
                if (isOn) btn.classList.add('btn-highlight');
                else btn.classList.remove('btn-highlight');
            }
        }

        function syncGateHighlight(gate, isOn) {
            toggleLineHighlight(gateLineMap[gate] || [], isOn);
            const btn = document.getElementById('gate-' + gate.toLowerCase());
            if (btn) {
                if (isOn) btn.classList.add('btn-highlight');
                else btn.classList.remove('btn-highlight');
            }
        }

        function handleLineClick(lineId) {
            const gate = getGateForLine(lineId);
            if (gate) applyGate(gate);
        }

        function pushHistory() { historyStack.push([...gateHistory]); }

        function applyGate(g) {
            if(typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(e=>{}); }
            
            if (selectedIndices.length > 0) {
                let targetIdx = Math.min(...selectedIndices);
                let newHistory = [];
                for(let i=0; i<gateHistory.length; i++) {
                    if (i === targetIdx) newHistory.push(g);
                    else if (!selectedIndices.includes(i)) newHistory.push(gateHistory[i]);
                }
                gateHistory = newHistory;
                selectedIndices = [];
                pushHistory();
                recalculatePositions();
                finishMove();
            } else {
                gateHistory.push(g);
                pushHistory();
                recalculatePositions();
                finishMove();
            }

            if (isTouchDevice) {
                setTimeout(() => {
                    syncGateHighlight(g, false);
                    const btn = document.getElementById('gate-' + g.toLowerCase());
                    if (btn) btn.blur();
                }, 800); 
            }
        }

        function getPermutationForGate(g) {
            return [0, 1, 2, 3].map(pos => {
                let q0 = Math.floor(pos / 2), q1 = pos % 2;
                if (g === 'X0') q0 = 1 - q0;
                else if (g === 'X1') q1 = 1 - q1;
                else if (g === 'CX01' && q0 === 1) q1 = 1 - q1;
                else if (g === 'C0X01' && q0 === 0) q1 = 1 - q1;
                else if (g === 'CX10' && q1 === 1) q0 = 1 - q0;
                else if (g === 'C0X10' && q1 === 0) q0 = 1 - q0;
                return q0 * 2 + q1;
            });
        }

        function recalculatePositions() {
            let cp = [...initialFishAtNode]; 
            gateHistory.forEach(g => {
                const pm = getPermutationForGate(g); 
                const next = new Array(4);
                for (let oldNode = 0; oldNode < 4; oldNode++) {
                    const newNode = pm[oldNode];
                    next[newNode] = cp[oldNode];
                }
                cp = next;
            });
            fishAtNode = cp;
        }

        function finishMove() {
            document.getElementById('step-count').innerText = gateHistory.length;
            updateTruthTable();
            for (let i = 0; i < 4; i++) {
                const nodeEl = document.getElementById(`node-${i}`);
                if (nodeEl) nodeEl.classList.toggle('node-correct', fishAtNode[i] === i);
            }
            if (isTraceMode) {
                if (currentTraceStep > gateHistory.length) currentTraceStep = gateHistory.length;
                renderTraceStep();
            } else {
                updateFishUI();
                updateFishVisibility();
                renderCircuit();
            }
        }

        function updateFishUI() {
            for(let i=0; i<4; i++) {
                const f = document.getElementById(`fish-${fishAtNode[i]}`);
                const n = document.getElementById(`node-${i}`);
                if(f && n) {
                    f.style.top = (n.offsetTop + 75) + "px";
                    f.style.left = (n.offsetLeft + 30) + "px";
                }
                const nodeEl = document.getElementById(`node-${i}`);
                if (nodeEl) nodeEl.classList.toggle('node-correct', fishAtNode[i] === i);
            }
            updateFeatureHighlights();
        }

        function renderCircuit() {
            const c = document.getElementById('circuit-content');
            const wrapper = document.getElementById('circuit-content-wrapper');
            c.innerHTML = '';
            let states = [];
            if (activeTraceInput !== null) {
                let curr = initialFishAtNode.indexOf(activeTraceInput);
                if (curr !== -1) {
                    states.push(curr);
                    for (let k = 0; k < gateHistory.length; k++) {
                        curr = getPermutationForGate(gateHistory[k])[curr];
                        states.push(curr);
                    }
                }
            }
            const drawWires = (parentUnit, stepIdx) => {
                if (!isQuantumMode) return;
                for (let q = 0; q < 2; q++) {
                    let wire = document.createElement('div');
                    wire.className = 'horizontal-wire';
                    wire.style.position = 'absolute';
                    wire.style.left = '-3px';
                    wire.style.width = 'calc(100% + 6px)';
                    wire.style.height = '3px';
                    wire.style.top = (q === 0 ? 13 : 60) + 'px';
                    wire.style.zIndex = '1';
                    if (isTraceMode) {
                        if (activeTraceInput !== null) {
                            if (stepIdx <= currentTraceStep) {
                                let bit = (states[stepIdx] >> (1 - q)) & 1;
                                if (bit === 1) {
                                    wire.style.background = '#FFB7C5';
                                    wire.style.boxShadow = '0 0 8px #FFB7C5';
                                } else {
                                    wire.style.background = '#8a6d1c';
                                    wire.style.boxShadow = 'none';
                                }
                            } else {
                                wire.style.background = '#d1d5db';
                                wire.style.boxShadow = 'none';
                            }
                        } else {
                            if (stepIdx <= currentTraceStep) {
                                wire.style.background = '#463438';
                                wire.style.boxShadow = 'none';
                            } else {
                                wire.style.background = '#d1d5db';
                                wire.style.boxShadow = 'none';
                            }
                        }
                    } else {
                        wire.style.background = '#463438';
                    }
                    parentUnit.appendChild(wire);
                }
            };
            
            const startU = document.createElement('div');
            startU.className = 'circuit-unit';
            startU.style.minWidth = '30px';
            startU.style.cursor = 'default';
            startU.dataset.type = 'start';
            if (!isQuantumMode) startU.style.display = 'none';
            drawWires(startU, 0);
            c.appendChild(startU);
            
            gateHistory.forEach((g, idx) => {
                const u = document.createElement('div');
                u.className = 'circuit-unit' + (selectedIndices.includes(idx) ? ' selected' : '');
                u.dataset.type = 'gate';
                u.dataset.idx = idx;
                
                const hex = getGateColorMap(g);
                u.style.setProperty('--bg-hover', getRgba(hex, 0.35));
                u.style.setProperty('--bg-selected', hex);
                
                u.draggable = !isTouchDevice;
                drawWires(u, idx + 1);
                
                const sFrame = document.createElement('div');
                sFrame.className = 'dragging-snapshot-frame';
                u.appendChild(sFrame);
                
                const visuals = document.createElement('div');
                visuals.className = 'gate-visuals';
                visuals.style.position = 'absolute';
                visuals.style.inset = '0';
                visuals.style.width = '100%';
                visuals.style.height = '100%';
                visuals.style.pointerEvents = 'none';
                visuals.style.zIndex = '10';
                
                if (isTraceMode) {
                    if (idx === currentTraceStep - 1) u.classList.add('trace-active');
                    else if (idx >= currentTraceStep) visuals.style.opacity = '0.35';
                }
                
                if (!isQuantumMode) {
                    let traceState = (isTraceMode && activeTraceInput !== null) ? states[idx + 1] : null;
                    visuals.innerHTML = getMiniSquareSVG(g, traceState);
                } else {
                    if(g.startsWith('X')) {
                        const tQ = g==='X0'?0:1, tY = tQ===0?14.5:61.5, t = document.createElement('div');
                        t.className = 'circuit-target';
                        t.style.left = '50%';
                        t.style.top = (tY)+'px';
                        visuals.appendChild(t);
                    }
                    else {
                        const is01 = g.includes('01'), is0 = g.includes('C0'), cY = is01?14.5:61.5, tY = is01?61.5:14.5;
                        const v = document.createElement('div');
                        v.className = 'connection-v-line';
                        v.style.left = '50%';
                        v.style.top = Math.min(cY,tY)+'px';
                        v.style.height = '47px';
                        visuals.appendChild(v);
                        const d = document.createElement('div');
                        d.className = 'control-dot';
                        d.style.left = '50%';
                        d.style.top = (cY)+'px';
                        if(is0){
                            d.style.boxSizing = 'border-box';
                            d.style.background = 'white'; 
                            d.style.border = '2.5px solid #463438';
                        }
                        visuals.appendChild(d);
                        
                        const t = document.createElement('div');
                        t.className = 'circuit-target';
                        t.style.left = '50%';
                        t.style.top = (tY)+'px';
                        visuals.appendChild(t);
                    }
                }
                
                u.appendChild(visuals);
                
                if (!isTouchDevice) {
                    u.ondragstart = (e) => {
                        draggedIndex = idx;
                        e.dataTransfer.effectAllowed = 'move';
                        u.classList.add('during-snapshot'); 
                        const wires = u.querySelectorAll('.horizontal-wire');
                        wires.forEach(w => w.style.opacity = '0');
                        u.style.background = 'transparent'; 
                        visuals.style.opacity = '1';
                        setTimeout(() => {
                            u.classList.remove('during-snapshot'); 
                            wires.forEach(w => w.style.opacity = '1');
                            u.style.background = '';
                            visuals.style.opacity = '0.35';
                        }, 0);
                    };
                    u.ondragend = (e) => { 
                        visuals.style.opacity = '1';
                        draggedIndex = null;
                        document.querySelectorAll('.circuit-unit').forEach(unit => {
                            unit.classList.remove('drag-target', 'drag-target-right');
                        });
                    };
                }
                
                let touchTimer = null;
                let startX, startY;
                let swipeActionTriggered = false;

                u.addEventListener('touchstart', (e) => {
                    if (e.touches.length > 1) return;
                    u.draggable = false; 
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    swipeActionTriggered = false;
                    
                    touchTimer = setTimeout(() => {
                        touchTimer = null;
                        startMobileDrag(e.touches[0], u, idx);
                    }, 300); 
                }, {passive: true});

                u.addEventListener('touchmove', (e) => {
                    if (mobileDragging) {
                        if (e.cancelable) e.preventDefault();
                        moveMobileDrag(e.touches[0]);
                        
                        const wrapper = document.getElementById('circuit-content-wrapper');
                        const wrapperRect = wrapper.getBoundingClientRect();
                        
                        if (e.touches[0].clientX < wrapperRect.left) {
                            document.querySelectorAll('.circuit-unit').forEach(el => el.classList.remove('drag-target', 'drag-target-right'));
                        } else {
                            const targetEl = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
                            if (targetEl) {
                                const targetUnit = targetEl.closest('.circuit-unit');
                                if (targetUnit) {
                                    const type = targetUnit.dataset.type;
                                    const isSelf = type === 'gate' && parseInt(targetUnit.dataset.idx) === draggedIndex;
                                    if (!isSelf) {
                                        document.querySelectorAll('.circuit-unit').forEach(el => el.classList.remove('drag-target', 'drag-target-right'));
                                        const rect = targetUnit.getBoundingClientRect();
                                        const isAfter = (e.touches[0].clientX - rect.left) > (rect.width / 2);
                                        
                                        if (targetUnit.dataset.type === 'start') {
                                            targetUnit.classList.add('drag-target-right');
                                        } else if (targetUnit.dataset.type === 'end') {
                                            targetUnit.classList.add('drag-target');
                                        } else {
                                            if (isAfter) targetUnit.classList.add('drag-target-right');
                                            else targetUnit.classList.add('drag-target');
                                        }
                                    }
                                }
                            }
                        }

                    } else if (!swipeActionTriggered && (touchTimer !== null || startY !== undefined)) {
                        const dx = e.touches[0].clientX - startX;
                        const dy = e.touches[0].clientY - startY;

                        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                            if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
                        }

                        if (Math.abs(dy) > 30 && Math.abs(dy) > Math.abs(dx)) {
                            if (e.cancelable) e.preventDefault();

                            if (dy > 30) {
                                const sIdx = selectedIndices.indexOf(idx);
                                if (sIdx > -1) selectedIndices.splice(sIdx, 1); 
                                else selectedIndices.push(idx);
                                renderCircuit();
                                swipeActionTriggered = true;
                                startY = undefined;
                            } else if (dy < -30) {
                                if (typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(err=>{}); }
                                syncGateHighlight(g, false);
                                selectedIndices = [];
                                deleteGate(idx);
                                swipeActionTriggered = true;
                                startY = undefined;
                            }
                        }
                    }
                }, {passive: false});

                u.addEventListener('touchend', (e) => {
                    if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
                    if (mobileDragging) {
                        if (e.cancelable) e.preventDefault();
                        endMobileDrag(e.changedTouches[0]);
                    }
                    if (activeTraceInput === null) setTimeout(() => { u.draggable = true; }, 100);
                    swipeActionTriggered = false;
                });

                u.addEventListener('touchcancel', (e) => {
                    if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
                    if (mobileDragging) endMobileDrag(e.changedTouches[0]);
                    if (activeTraceInput === null) setTimeout(() => { u.draggable = true; }, 100);
                    swipeActionTriggered = false;
                });
                u.onmouseover = () => syncGateHighlight(g, true);
                u.onmouseout = () => syncGateHighlight(g, false);
                
                u.onclick = (e) => {
                    if (mobileDragging) return;
                    syncGateHighlight(g, false);
                    selectedIndices = [];
                    deleteGate(idx);
                };

                u.oncontextmenu = (e) => {
                    e.preventDefault();
                    if (mobileDragging) return false;
                    const sIdx = selectedIndices.indexOf(idx);
                    if (sIdx > -1) selectedIndices.splice(sIdx, 1);
                    else selectedIndices.push(idx);
                    renderCircuit();
                    return false;
                };

                c.appendChild(u);
            });
            
            const endU = document.createElement('div');
            endU.className = 'circuit-unit';
            endU.style.minWidth = '50px';
            endU.style.flexGrow = '1';
            endU.style.cursor = 'default';
            endU.dataset.type = 'end';
            if (!isQuantumMode) endU.style.display = 'none';
            drawWires(endU, states.length > 0 ? states.length - 1 : 0);
            c.appendChild(endU);

            updateUndoStatus();
            if (!isTraceMode && selectedIndices.length === 0 && gateHistory.length > 0 && draggedIndex === null && activeTraceInput === null) {
                setTimeout(() => { if(wrapper) wrapper.scrollTo({ left: wrapper.scrollWidth, behavior: 'smooth' }); }, 100);
            }
        }

        function undo() {
            if (historyStack.length <= 1) return;
            if(typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(e=>{}); }
            historyStack.pop();
            gateHistory = [...historyStack[historyStack.length - 1]];
            selectedIndices = []; recalculatePositions(); finishMove();
        }

        function resetCircuit() {
            if(typeof pop !== 'undefined' && pop.play) { pop.currentTime = 0; pop.play().catch(e=>{}); }
            fishAtNode = [...initialFishAtNode];
            gateHistory = [];
            historyStack = [[]];
            selectedIndices = [];
            finishMove();
        }

        function deleteGate(idx) {
            if(typeof pop !== 'undefined' && pop.play) { pop.currentTime=0; pop.play().catch(e=>{}); }
            gateHistory.splice(idx,1);
            pushHistory();
            recalculatePositions();
            finishMove();
        }

        function updateUndoStatus() {
            const isActive = (historyStack.length > 1);
            const ub = document.getElementById('undo-btn');
            if(ub) {
                if(isActive){ ub.classList.add('active'); ub.style.pointerEvents="auto"; }
                else { ub.classList.remove('active'); ub.style.pointerEvents="none"; }
            }
        }

        function shareCircuit() {
            if (gateHistory.length === 0 && initialFishAtNode.join(',') === '0,1,2,3') {
                alert("The circuit is empty and cannot be shared.");
                return;
            }
            const circuitData = gateHistory.join(',');
            let shareUrl = `${window.location.origin}${window.location.pathname}?circuit=${encodeURIComponent(circuitData)}`;
            
            if (initialFishAtNode.join(',') !== '0,1,2,3') {
                shareUrl += `&input=${initialFishAtNode.join(',')}`;
            }

            navigator.clipboard.writeText(shareUrl).then(() => {
                alert("Circuit sharing link copied! Send it to a friend to open this circuit.");
            }).catch(err => {
                console.error('Failed to copy link', err);
                alert("Link: " + shareUrl);
            });
        }

        function navWithSound(url) {
            if (typeof pop !== 'undefined') {
                pop.currentTime = 0;
                pop.play(); 
            }
            setTimeout(() => {
                window.location.href = url;
            }, 150); 
        }
    </script>
</body>
</html>
